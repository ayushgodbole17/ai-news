name: daily ai digest

on:
  # Measured over 13 consecutive days, GitHub fired this repo's crons 4.3-5.6 hours
  # late, every single day, never improving. So this does not try to name the delivery
  # time here at all -- it sprays a run every half hour across the night and morning,
  # and digest.py decides which one sends (the first to land at or after SEND_AFTER,
  # local time). Covers both today's ~5h delay and a future where GitHub fires on time.
  # Odd minutes on purpose: :00 and :30 are the most congested slots on the platform.
  schedule:
    - cron: "13,43 22-23,0-8 * * *"
  workflow_dispatch:

concurrency:                # never let two attempts run at once
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # no pip install: digest.py is stdlib only

      # What was already sent, and which repos to watch. Kept in the Actions cache
      # rather than committed back, so the repo history stays clean. The key is
      # unique per run and restore-keys picks up the newest previous one, which is
      # the standard way to carry a rolling file forward. Losing it costs one
      # repeated digest, nothing worse.
      - uses: actions/cache@v4
        with:
          path: |
            seen.json
            last_sent.txt
            repos.json
          key: digest-state-${{ github.run_id }}
          restore-keys: digest-state-

      - run: python digest.py --once-daily
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}   # lifts the repo-discovery rate limit
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:     ${{ vars.GEMINI_MODEL }}
          DIGEST_TO:        ${{ secrets.DIGEST_TO }}
          DIGEST_FROM:      ${{ secrets.DIGEST_FROM }}
          DIGEST_SMTP_PASS: ${{ secrets.DIGEST_SMTP_PASS }}
          # config.json is gitignored and never reaches this checkout -- these are
          # how a scheduled run gets a real profile instead of digest.py's built-in
          # default. Optional: unset, this just runs on the defaults.
          DIGEST_PROFILE:       ${{ secrets.DIGEST_PROFILE }}
          DIGEST_KEEP_SHIPS:    ${{ vars.DIGEST_KEEP_SHIPS }}
          DIGEST_KEEP_RESEARCH: ${{ vars.DIGEST_KEEP_RESEARCH }}
          # When the mail should land and in whose timezone. Defaults are 09:45 and
          # +05:30 (IST) -- set these only to move it.
          DIGEST_SEND_AFTER:    ${{ vars.DIGEST_SEND_AFTER }}
          DIGEST_UTC_OFFSET:    ${{ vars.DIGEST_UTC_OFFSET }}
